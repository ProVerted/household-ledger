name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - 'milestone-*'
  pull_request:
    branches:
      - main
      - 'milestone-*'

jobs:
  backend-test:
    name: Backend Tests & Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Run Backend Unit & Security Tests
        run: mvn -f backend/pom.xml test

  frontend-test:
    name: Frontend Tests & Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend-app/package-lock.json

      - name: Install dependencies
        run: npm --prefix frontend-app ci

      - name: Run Frontend Unit Tests
        run: npm --prefix frontend-app run test -- --no-watch

      - name: Build Angular Production Distribution
        run: npm --prefix frontend-app run build

  docker-validation:
    name: Docker Images Build Verification
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: household-ledger-backend:ci

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend-app
          file: ./frontend-app/Dockerfile
          push: false
          tags: household-ledger-frontend:ci
